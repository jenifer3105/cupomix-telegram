name: Cupomix - Ofertas Shopee

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cupomix-ofertas
  cancel-in-progress: false

jobs:
  publicar-oferta:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests

      - name: Buscar oferta e publicar com link de afiliado
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
        run: |
          python <<'PY'
          import os
          import json
          import hashlib
          import time
          import requests
          from pathlib import Path
          from decimal import Decimal, InvalidOperation
          from html import escape
          from urllib.parse import urlparse

          API_URL = "https://open-api.affiliate.shopee.com.br/graphql"
          TELEGRAM_URL = f"https://api.telegram.org/bot{os.environ['BOT_TOKEN']}"
          HISTORY_FILE = Path("historico.json")

          APP_ID = os.environ["SHOPEE_APP_ID"]
          SECRET = os.environ["SHOPEE_SECRET"]

          def request_shopee(query):
              timestamp = str(int(time.time()))
              body = json.dumps(
                  {"query": query},
                  separators=(",", ":"),
                  ensure_ascii=False
              )
              base = APP_ID + timestamp + body + SECRET
              signature = hashlib.sha256(base.encode("utf-8")).hexdigest()

              headers = {
                  "Content-Type": "application/json",
                  "Authorization": (
                      f"SHA256 Credential={APP_ID}, "
                      f"Timestamp={timestamp}, "
                      f"Signature={signature}"
                  )
              }

              response = requests.post(
                  API_URL,
                  data=body.encode("utf-8"),
                  headers=headers,
                  timeout=30
              )
              response.raise_for_status()
              data = response.json()

              if data.get("errors"):
                  raise RuntimeError(
                      "Erro da API Shopee: " +
                      json.dumps(data["errors"], ensure_ascii=False)
                  )

              return data.get("data") or {}

          def gerar_link_afiliado(link_produto):
              if not isinstance(link_produto, str) or not link_produto.startswith("https://"):
                  return None

              url_json = json.dumps(link_produto, ensure_ascii=False)
              query = (
                  "mutation { "
                  "generateShortLink(input: { "
                  f"originUrl: {url_json}, "
                  'subIds: ["cupomix", "telegram"] '
                  "}) { shortLink } "
                  "}"
              )

              try:
                  data = request_shopee(query)
                  resultado = data.get("generateShortLink") or {}
                  link_curto = resultado.get("shortLink")

                  if not isinstance(link_curto, str):
                      return None

                  link_curto = link_curto.strip()
                  if not link_curto.startswith("https://") or any(c.isspace() for c in link_curto):
                      return None

                  host = (urlparse(link_curto).hostname or "").lower()
                  if not (
                      host == "s.shopee.com.br"
                      or host.endswith(".shope.ee")
                      or host.endswith(".shopee.com.br")
                  ):
                      print("Link retornado não passou pela validação de domínio.")
                      return None

                  return link_curto

              except Exception as erro:
                  print(f"Não foi possível gerar link afiliado: {erro}")
                  return None

          def enviar_telegram(metodo, dados):
              response = requests.post(
                  f"{TELEGRAM_URL}/{metodo}",
                  json=dados,
                  timeout=30
              )
              response.raise_for_status()
              resultado = response.json()

              if not resultado.get("ok"):
                  raise RuntimeError(
                      f"Telegram não aceitou a publicação: {resultado}"
                  )

              return resultado

          def carregar_historico():
              if not HISTORY_FILE.exists():
                  return []
              try:
                  dados = json.loads(HISTORY_FILE.read_text(encoding="utf-8"))
                  return dados if isinstance(dados, list) else []
              except (json.JSONDecodeError, OSError):
                  return []

          historico = carregar_historico()
          historico_set = set(historico)

          produto_escolhido = None
          link_afiliado_escolhido = None

          # Só escolhe uma oferta depois de gerar um link curto.
          for pagina in range(1, 11):
              query = (
                  "query { "
                  "productOfferV2("
                  f"page: {pagina}, limit: 50"
                  ") { "
                  "nodes { productName price imageUrl productLink } "
                  "} "
                  "}"
              )

              try:
                  data = request_shopee(query)
              except Exception as erro:
                  print(f"Falha ao buscar produtos: {erro}")
                  continue

              resultado = data.get("productOfferV2") or {}
              produtos = resultado.get("nodes") or []

              for produto in produtos:
                  link_original = produto.get("productLink")
                  if not link_original or link_original in historico_set:
                      continue

                  link_afiliado = gerar_link_afiliado(link_original)
                  if not link_afiliado:
                      print("Oferta ignorada: não foi possível gerar um link afiliado válido.")
                      continue

                  produto_escolhido = produto
                  link_afiliado_escolhido = link_afiliado
                  break

              if produto_escolhido:
                  break

          if not produto_escolhido:
              print("Nenhuma oferta nova com link afiliado válido. Nada será publicado.")
              raise SystemExit(0)

          produto = produto_escolhido
          nome = str(produto.get("productName") or "Oferta Shopee").strip()
          imagem = produto.get("imageUrl")
          link_afiliado = link_afiliado_escolhido

          try:
              preco = Decimal(str(produto.get("price")))
              if not preco.is_finite() or preco <= 0:
                  raise InvalidOperation()
              preco_formatado = f"{preco:.2f}".replace(".", ",")
          except (InvalidOperation, ValueError, TypeError):
              preco_formatado = None

          nome_seguro = escape(nome)
          link_seguro = escape(link_afiliado, quote=True)

          legenda = (
              "🔥 <b>OFERTA SHOPEE</b> 🔥\n\n"
              f"🛍️ <b>{nome_seguro}</b>\n\n"
          )

          if preco_formatado:
              legenda += f"💰 <b>Preço: R$ {preco_formatado}</b>\n\n"

          legenda += (
              "👇 Confira a oferta:\n"
              f'<a href="{link_seguro}">{escape(link_afiliado)}</a>\n\n'
              "⚡ Preço e disponibilidade podem mudar.\n\n"
              "🧡 <i>Cupomix • Seus achadinhos favoritos</i>"
          )

          # Mantém a legenda abaixo do limite do Telegram.
          if len(legenda) > 1000:
              legenda = (
                  "🔥 <b>OFERTA SHOPEE</b> 🔥\n\n"
                  f"🛍️ <b>{escape(nome[:220])}</b>\n\n"
                  + (f"💰 <b>Preço: R$ {preco_formatado}</b>\n\n" if preco_formatado else "")
                  + "👇 Confira a oferta:\n"
                  + f'<a href="{link_seguro}">Clique aqui para ver a oferta</a>\n\n'
                  + "⚡ Preço e disponibilidade podem mudar.\n\n"
                  + "🧡 <i>Cupomix • Seus achadinhos favoritos</i>"
              )

          # Link aparece na própria mensagem; sem botão de compra.
          if imagem and str(imagem).startswith("https://"):
              resposta = enviar_telegram("sendPhoto", {
                  "chat_id": os.environ["CHAT_ID"],
                  "photo": imagem,
                  "caption": legenda,
                  "parse_mode": "HTML"
              })
          else:
              resposta = enviar_telegram("sendMessage", {
                  "chat_id": os.environ["CHAT_ID"],
                  "text": legenda,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": False
              })

          # Só registra a oferta depois que o Telegram confirma o envio.
          historico.append(produto["productLink"])
          HISTORY_FILE.write_text(
              json.dumps(historico[-2000:], ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print("Oferta publicada com link curto gerado pela API.")
          print(f"Mensagem Telegram ID: {resposta['result']['message_id']}")
          PY

      - name: Salvar histórico de ofertas
        run: |
          if ! git diff --quiet -- historico.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add historico.json
            git commit -m "Atualiza histórico de ofertas"
            git push
          else
            echo "Nenhuma nova oferta publicada."
          fi
