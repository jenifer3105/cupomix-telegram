
name: Cupomix Telegram

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  enviar-ofertas:
    runs-on: ubuntu-latest

    steps:
      - name: Buscar uma oferta Shopee e enviar Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}

        run: |
          python3 <<'PY'
          import os
          import time
          import json
          import hashlib
          import random
          import requests

          APP_ID = os.environ["SHOPEE_APP_ID"]
          SECRET = os.environ["SHOPEE_SECRET"]
          BOT_TOKEN = os.environ["BOT_TOKEN"]
          CHAT_ID = os.environ["CHAT_ID"]

          SHOPEE_URL = "https://open-api.affiliate.shopee.com.br/graphql"

          def shopee_request(query):
              timestamp = int(time.time())

              payload = json.dumps(
                  {"query": query},
                  separators=(",", ":")
              )

              factor = APP_ID + str(timestamp) + payload + SECRET
              signature = hashlib.sha256(
                  factor.encode()
              ).hexdigest()

              authorization = (
                  f"SHA256 Credential={APP_ID}, "
                  f"Timestamp={timestamp}, "
                  f"Signature={signature}"
              )

              response = requests.post(
                  SHOPEE_URL,
                  headers={
                      "Content-Type": "application/json",
                      "Authorization": authorization
                  },
                  data=payload,
                  timeout=30
              )

              response.raise_for_status()
              data = response.json()

              if "errors" in data:
                  raise Exception(json.dumps(data["errors"]))

              return data

          # Buscar até 10 produtos
          query = """
          query {
            productOfferV2(page: 1, limit: 10) {
              nodes {
                productName
                price
                imageUrl
                productLink
              }
            }
          }
          """

          data = shopee_request(query)

          products = (
              data.get("data", {})
                  .get("productOfferV2", {})
                  .get("nodes", [])
          )

          if not products:
              print("Nenhuma oferta encontrada.")
              raise SystemExit(0)

          # Escolher somente 1 produto
          product = random.choice(products)

          name = product.get("productName", "Produto")
          price = product.get("price", "")
          product_link = product.get("productLink", "")

          if not product_link:
              raise Exception("Produto sem link.")

          # Gerar link de afiliado
          escaped_link = json.dumps(product_link)

          mutation = """
          mutation {
            generateShortLink(
              input: {
                originUrl: %s
                subIds: ["telegram", "cupomix"]
              }
            ) {
              shortLink
            }
          }
          """ % escaped_link

          affiliate_data = shopee_request(mutation)

          affiliate_link = (
              affiliate_data.get("data", {})
              .get("generateShortLink", {})
              .get("shortLink", "")
          )

          if not affiliate_link:
              raise Exception(
                  "A Shopee não retornou o link de afiliado."
              )

          # Enviar uma única mensagem ao Telegram
          message = f"""🔥 OFERTA NA SHOPEE 🔥

          🛍️ {name}

          💰 Preço: R$ {price}

          👉 COMPRAR AGORA:
          {affiliate_link}

          ⚡ Confira o preço e os cupons disponíveis na Shopee!

          🟠 Cupomix"""

          telegram_url = (
              f"https://api.telegram.org/bot"
              f"{BOT_TOKEN}/sendMessage"
          )

          response = requests.post(
              telegram_url,
              data={
                  "chat_id": CHAT_ID,
                  "text": message
              },
              timeout=30
          )

          response.raise_for_status()

          result = response.json()

          if not result.get("ok"):
              raise Exception(
                  "Erro Telegram: " + json.dumps(result)
              )

          print("Uma oferta foi enviada ao Telegram.")

          PY
