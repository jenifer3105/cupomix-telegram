name: Robo de Cupons Shopee

on:
  workflow_dispatch:
  schedule:
    # Tenta verificar nos minutos 00, 05, 10, 15... de cada hora (UTC).
    - cron: "0,5,10,15,20,25,30,35,40,45,50,55 * * * *"

permissions:
  contents: write

concurrency:
  group: robo-cupons-shopee
  cancel-in-progress: false

jobs:
  cupons:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Buscar e publicar cupons
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import re
          import json
          import html
          import subprocess
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          from urllib.parse import urlparse
          import requests
          from bs4 import BeautifulSoup

          token = os.environ["BOT_TOKEN"]
          chat_id = os.environ["CHAT_ID"]
          arquivo = Path("robo_cupons/cupons.json")
          arquivo.parent.mkdir(parents=True, exist_ok=True)

          # Historico: codigo do cupom -> horario UTC da ultima publicacao.
          # Migra o formato antigo (lista de identificadores) sem quebrar a execucao.
          agora = datetime.now(timezone.utc)
          limite_duplicidade = timedelta(hours=24)
          try:
              historico_bruto = json.loads(arquivo.read_text(encoding="utf-8"))
          except (FileNotFoundError, json.JSONDecodeError, OSError):
              historico_bruto = {}

          publicados = {}
          if isinstance(historico_bruto, dict):
              for codigo_antigo, horario in historico_bruto.items():
                  try:
                      momento = datetime.fromisoformat(str(horario).replace("Z", "+00:00"))
                      if momento.tzinfo is None:
                          momento = momento.replace(tzinfo=timezone.utc)
                      if agora - momento <= limite_duplicidade and momento <= agora + timedelta(minutes=10):
                          publicados[str(codigo_antigo).upper()] = momento.astimezone(timezone.utc).isoformat()
                  except (TypeError, ValueError):
                      continue
          elif isinstance(historico_bruto, list):
              # Mantem codigos antigos conhecidos por 24h; IDs de posts antigos
              # nao permitem recuperar com seguranca o codigo que continham.
              for item in historico_bruto:
                  if isinstance(item, str) and item.startswith("codigo:"):
                      codigo_antigo = item.split(":", 1)[1].strip().upper()
                      if codigo_antigo:
                          publicados[codigo_antigo] = agora.isoformat()

          canais = ["cuponsvoltando", "fadadoscupons", "afiliadosshopeebroficial"]
          sessao = requests.Session()
          sessao.headers.update({"User-Agent": "Mozilla/5.0"})

          invalidos = {
              "SHOPEE", "CUPOM", "CUPONS", "CODIGO", "CÓDIGO", "DISPONIVEL",
              "DISPONÍVEL", "DESCONTO", "RESGATE", "CARRINHO", "OFERTA",
              "COMPRAS", "VALIDO", "VÁLIDO", "PROMOCAO", "PROMOÇÃO",
              "GRATIS", "GRÁTIS", "AFILIADO", "AFILIADA", "PRODUTOS",
              "COMISSAO", "COMISSÃO", "ANUNCIO", "ANÚNCIO", "LINK", "AQUI",
              "DINHEIRO", "VOLTOU", "RESTAM", "USOS", "NINTENDO", "NORMAL",
              "VIP", "DISPON", "RESGATAR", "COD", "PARA", "ACIMA", "MINIMO",
              "MÍNIMO"
          }

          def eh_link_shopee(link):
              try:
                  host = (urlparse(link).hostname or "").lower()
              except Exception:
                  return False
              return (
                  host == "shopee.com.br" or host.endswith(".shopee.com.br")
                  or host == "shopee.com" or host.endswith(".shopee.com")
                  or host == "shope.ee" or host.endswith(".shope.ee")
              )

          def extrair_links(postagem):
              prioritarios = []
              outros = []

              for a in postagem.select("a[href]"):
                  link = (a.get("href") or "").strip()
                  if not link.startswith(("https://", "http://")) or not eh_link_shopee(link):
                      continue

                  rotulo = " ".join([
                      a.get_text(" ", strip=True),
                      a.get("aria-label", ""),
                      a.get("title", ""),
                  ]).lower()

                  # Não usar link de carrinho nem link direto de produto como resgate.
                  if "carrinho" in rotulo or "/product/" in link.lower():
                      continue

                  if any(palavra in rotulo for palavra in ("resgate", "usar cupom", "resgatar", "usar")):
                      if link not in prioritarios:
                          prioritarios.append(link)
                  elif link not in outros:
                      outros.append(link)

              # Se o link está escrito no corpo do post, tenta priorizar o que vem
              # depois de "Resgate" / "Resgate aqui".
              texto = postagem.get_text(" ", strip=True)
              urls = re.findall(r"https?://[^\s<>\"']+", texto)
              for link in urls:
                  link = link.rstrip(").,;!?]")
                  if not eh_link_shopee(link) or "/product/" in link.lower():
                      continue
                  if link not in prioritarios and link not in outros:
                      outros.append(link)

              return prioritarios + outros

          def extrair_codigo(texto, elemento=None):
              """Extrai o código completo, dando prioridade ao trecho formatado como código."""
              texto = (texto or "").replace("\u200b", "").replace("\u200c", "").replace("\ufeff", "")

              def validar(valor):
                  valor = re.sub(r"\s+", "", valor or "").upper().strip("_-")
                  if not 6 <= len(valor) <= 30:
                      return None
                  if valor in invalidos or not re.search(r"[A-Z]", valor) or not re.search(r"\d", valor):
                      return None
                  # Não aceita pedaços claramente incompletos terminando em hífen/underscore.
                  return valor

              # Telegram costuma marcar códigos em <code>; ler o nó inteiro evita pegar só um pedaço.
              if elemento is not None:
                  for no in elemento.select("code, pre"):
                      candidato = validar(no.get_text("", strip=True))
                      if candidato:
                          return candidato

              # Procura o valor logo após o rótulo, aceitando espaços/formatos entre o rótulo e o código.
              rotulos = [
                  r"(?:c[oó]digo(?:\s+do\s+cupom)?|cupom)\s*(?:[:=\-]\s*)+([A-Z0-9_-]{6,30})",
                  r"(?:c[oó]digo(?:\s+do\s+cupom)?|cupom)\s+([A-Z0-9_-]{6,30})",
              ]
              for padrao in rotulos:
                  for m in re.finditer(padrao, texto, re.IGNORECASE):
                      candidato = validar(m.group(1))
                      if candidato:
                          return candidato

              # Códigos publicados antes do desconto ou da informação de usos.
              padroes_contexto = [
                  r"\b([A-Z0-9][A-Z0-9_-]{5,29})\b(?=\s*[:|–-]?\s*R\$\s*\d)",
                  r"\b([A-Z0-9][A-Z0-9_-]{5,29})\b(?=.{0,60}\b(?:restam|usos|expira|v[aá]lido)\b)",
                  r"R\$\s*\d+(?:[,.]\d+)?\s*OFF.{0,100}?\b([A-Z0-9][A-Z0-9_-]{5,29})\b",
              ]
              for padrao in padroes_contexto:
                  for m in re.finditer(padrao, texto, re.IGNORECASE):
                      candidato = validar(m.group(1))
                      if candidato:
                          return candidato

              # Último recurso: tokens completos com letras e números; prefere o mais longo,
              # para não publicar uma parte curta quando o código está colado a outro texto.
              tokens = re.findall(r"(?<![A-Z0-9_-])[A-Z0-9][A-Z0-9_-]{5,29}(?![A-Z0-9_-])", texto, re.IGNORECASE)
              candidatos = []
              for token in tokens:
                  candidato = validar(token)
                  if candidato and candidato not in candidatos:
                      candidatos.append(candidato)
              if candidatos:
                  return max(candidatos, key=len)
              return None

          def extrair_desconto(texto):
              resultado = re.search(
                  r"R\$\s*\d+(?:[,.]\d+)?\s*OFF"
                  r"(?:\s*(?:em|acima de|a partir de)\s*R\$\s*\d+(?:[,.]\d+)?)?",
                  texto, re.IGNORECASE
              )
              if resultado:
                  return resultado.group(0).strip()
              resultado = re.search(r"\d+\s*%\s*OFF", texto, re.IGNORECASE)
              return resultado.group(0).strip() if resultado else None

          def extrair_minimo(texto):
              resultado = re.search(
                  r"(?:em compras acima de|em compras a partir de|acima de|"
                  r"a partir de|mínimo de|minimo de|em compras de|compras acima de)"
                  r"\s*R\$\s*\d+(?:[,.]\d+)?", texto, re.IGNORECASE
              )
              if resultado:
                  valor = re.search(r"R\$\s*\d+(?:[,.]\d+)?", resultado.group(0), re.IGNORECASE)
                  return valor.group(0) if valor else None
              return None

          def classificar_tipo(texto):
              if re.search(r"\bVIP\b|exclusivo para membros|cupom vip|cupom exclusivo", texto, re.IGNORECASE):
                  return "💎 CUPOM VIP"
              return "🎟️ CUPOM NORMAL"

          total_novos = []
          codigos_nesta_execucao = set()
          janela = timedelta(hours=3)
          print(f"Horario de referencia UTC: {agora.isoformat()}")
          print(f"Janela de busca: ultimas {janela.total_seconds() / 3600:g} horas")

          for canal in canais:
              print(f"Consultando canal: {canal}")
              try:
                  resposta = sessao.get(f"https://t.me/s/{canal}", timeout=30)
                  resposta.raise_for_status()
                  soup = BeautifulSoup(resposta.text, "html.parser")
              except Exception as erro:
                  print(f"Falha ao consultar {canal}: {erro}")
                  continue

              postagens = soup.select(".tgme_widget_message_wrap")
              print(f"Publicações visíveis em {canal}: {len(postagens)}")

              for postagem in postagens:
                  # Processa apenas publicações recentes para não despejar o histórico
                  # inteiro no canal na primeira execução após esta correção.
                  cartao = postagem.select_one(".tgme_widget_message") or postagem
                  referencia = cartao.get("data-post", "")
                  partes = referencia.rsplit("/", 1)
                  id_post = partes[-1] if len(partes) == 2 and partes[-1].isdigit() else None
                  data_elemento = postagem.select_one(".tgme_widget_message_date time[datetime]")
                  data_texto = data_elemento.get("datetime") if data_elemento else None
                  if not data_texto:
                      print(f"Ignorado sem data verificavel: {canal}")
                      continue
                  try:
                      data_post = datetime.fromisoformat(data_texto.replace("Z", "+00:00"))
                      if data_post.tzinfo is None:
                          data_post = data_post.replace(tzinfo=timezone.utc)
                  except ValueError:
                      print(f"Ignorado com data invalida: {canal}")
                      continue
                  idade = agora - data_post
                  if idade > janela:
                      print(
                          f"Ignorado por antiguidade: {canal}/{id_post or '?'} "
                          f"| data={data_post.isoformat()} "
                          f"| idade_horas={idade.total_seconds() / 3600:.2f}"
                      )
                      continue
                  if data_post > agora + timedelta(minutes=10):
                      print(
                          f"Ignorado por data futura: {canal}/{id_post or '?'} "
                          f"| data={data_post.isoformat()}"
                      )
                      continue

                  no_texto = postagem.select_one(".tgme_widget_message_text")
                  if not no_texto:
                      print(f"Ignorado sem texto: {canal}/{id_post or '?'}")
                      continue
                  texto = no_texto.get_text(" ", strip=True)
                  # Aceita cupons mesmo quando a mensagem não usa a palavra "cupom".
                  if not re.search(
                      r"\bcupom\b|\bc[oó]digo\b|R\$\s*\d+(?:[,.]\d+)?\s*OFF|\d+\s*%\s*OFF",
                      texto, re.IGNORECASE
                  ):
                      continue
                  if re.search(
                      r"turbine suas comiss[oõ]es|comiss[oõ]es? em vendas|"
                      r"oportunidade de gerar cliques|produtos selecionados.*comiss[oã]o|"
                      r"comiss[oã]o.*redes sociais", texto, re.IGNORECASE
                  ):
                      print("Ignorado: anuncio comercial")
                      continue

                  links_shopee = extrair_links(postagem)
                  if not links_shopee:
                      print(f"Ignorado sem link Shopee reconhecido: {canal}")
                      continue
                  codigo = extrair_codigo(texto, no_texto)
                  desconto = extrair_desconto(texto)
                  if not codigo:
                      print(f"Ignorado: codigo nao identificado em {canal}")
                      continue
                  if not desconto:
                      print(f"Ignorado: desconto nao identificado para {codigo}")
                      continue

                  # Deduplica pelo codigo em todos os canais e durante esta execucao.
                  # O mesmo codigo pode voltar a ser publicado apos 24 horas.
                  codigo_chave = re.sub(r"\s+", "", codigo).upper()
                  if codigo_chave in codigos_nesta_execucao:
                      print(f"Cupom duplicado nesta execucao ignorado: {codigo_chave}")
                      continue
                  horario_anterior = publicados.get(codigo_chave)
                  if horario_anterior:
                      try:
                          momento_anterior = datetime.fromisoformat(horario_anterior.replace("Z", "+00:00"))
                          if momento_anterior.tzinfo is None:
                              momento_anterior = momento_anterior.replace(tzinfo=timezone.utc)
                          idade_cupom = agora - momento_anterior
                          if idade_cupom < limite_duplicidade:
                              restante = limite_duplicidade - idade_cupom
                              print(
                                  f"Cupom duplicado ignorado: {codigo_chave} "
                                  f"| publicado ha {idade_cupom.total_seconds() / 3600:.2f}h "
                                  f"| libera em {restante.total_seconds() / 3600:.2f}h"
                              )
                              continue
                      except ValueError:
                          pass

                  tipo = classificar_tipo(texto)
                  minimo = extrair_minimo(texto)
                  # Links diretos escolhidos conforme a categoria do cupom.
                  # O link aparece no texto, sem botão inline.
                  if tipo == "💎 CUPOM VIP":
                      link = "https://s.shopee.com.br/40aG8LLgaE"
                  else:
                      link = "https://s.shopee.com.br/1qU7Zs67MB"

                  mensagem = (
                      f"<b>{tipo}</b>\n\n"
                      "💰 <b>VOCÊ ECONOMIZA!</b>\n"
                      f"💸 <b>Desconto:</b> {html.escape(desconto)}\n"
                  )
                  if minimo:
                      mensagem += f"🛒 <b>Compra mínima:</b> {html.escape(minimo)}\n"
                  mensagem += (
                      "\n━━━━━━━━━━━━━━━━━━\n"
                      "🏷️ <b>CÓDIGO DE CUPOM:</b>\n\n"
                      f"🎟️ <code>{html.escape(codigo)}</code>\n"
                      "━━━━━━━━━━━━━━━━━━\n\n"
                      "👇 <b>RESGATE SEU CUPOM AQUI:</b> 👇\n"
                      f"{html.escape(link)}\n\n"
                      "⚠️ Confira as condições e a disponibilidade do cupom na Shopee.\n\n"
                      "🧡 <i>Cupomix • Seus achadinhos favoritos</i>"
                  )

                  try:
                      envio = sessao.post(
                          f"https://api.telegram.org/bot{token}/sendMessage",
                          json={
                              "chat_id": chat_id,
                              "text": mensagem,
                              "parse_mode": "HTML",
                              "disable_web_page_preview": True
                          },
                          timeout=30
                      )
                      envio.raise_for_status()
                      resultado = envio.json()
                      if resultado.get("ok"):
                          publicados[codigo_chave] = datetime.now(timezone.utc).isoformat()
                          codigos_nesta_execucao.add(codigo_chave)
                          total_novos.append(codigo_chave)
                          print(f"Publicado: {codigo} - {tipo}")
                      else:
                          print(f"Telegram recusou {codigo}: {resultado}")
                  except Exception as erro:
                      print(f"Erro ao publicar {codigo}: {erro}")

          # Remove entradas que ja passaram de 24h para manter o historico enxuto.
          agora_final = datetime.now(timezone.utc)
          publicados = {
              codigo: horario for codigo, horario in publicados.items()
              if (agora_final - datetime.fromisoformat(horario.replace("Z", "+00:00"))).total_seconds() < limite_duplicidade.total_seconds()
          }
          arquivo.write_text(
              json.dumps(publicados, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8"
          )

          if total_novos:
              subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
              subprocess.run([
                  "git", "config", "user.email",
                  "41898282+github-actions[bot]@users.noreply.github.com"
              ], check=True)
              subprocess.run(["git", "add", "robo_cupons/cupons.json"], check=True)
              subprocess.run(["git", "commit", "-m", "Atualizar historico de cupons"], check=True)
              subprocess.run(["git", "push"], check=True)

          print(f"Execucao concluida. Novos cupons: {len(total_novos)}")
          PY
