
name: Robo de Cupons Shopee

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  cupons:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Buscar e publicar cupons
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import re
          import json
          import html
          import hashlib
          import requests
          import subprocess
          from bs4 import BeautifulSoup
          from pathlib import Path

          token = os.environ["BOT_TOKEN"]
          chat_id = os.environ["CHAT_ID"]

          arquivo = Path("robo_cupons/cupons.json")
          arquivo.parent.mkdir(parents=True, exist_ok=True)

          try:
              publicados = set(
                  json.loads(arquivo.read_text(encoding="utf-8"))
              )
          except (FileNotFoundError, json.JSONDecodeError, OSError):
              publicados = set()

          canais = [
              "cuponsvoltando",
              "fadadoscupons",
              "afiliadosshopeebroficial",
          ]

          palavras_comuns = {
              "SHOPEE", "CUPOM", "CODIGO", "CÓDIGO",
              "DISPONIVEL", "DISPONÍVEL", "DESCONTO",
              "RESGATE", "CARRINHO", "OFERTA", "NINTENDO",
              "COMPRAS", "VALIDO", "VÁLIDO", "PROMOCAO",
              "PROMOÇÃO", "GRATIS", "GRÁTIS", "AFILIADO",
              "AFILIADA", "PRODUTOS", "COMISSAO", "COMISSÃO",
              "ANUNCIO", "ANÚNCIO", "LINK", "AQUI",
              "DINHEIRO", "VOLTOU", "RESTAM", "USOS",
          }

          sessao = requests.Session()
          sessao.headers.update({"User-Agent": "Mozilla/5.0"})
          novos = []

          # O código precisa estar associado a um rótulo de cupom,
          # ou aparecer antes de um valor de desconto.
          padroes_codigo = [
              r"(?:c[oó]digo|cupom)\s*(?:é|e|:|-)?\s*"
              r"([A-Z0-9][A-Z0-9_-]{4,24})",

              r"\b([A-Z0-9][A-Z0-9_-]{4,24})\s*:"
              r"\s*R\$\s*\d",

              r"\b([A-Z0-9][A-Z0-9_-]{4,24})\b"
              r"\s+(?:✅\s*)?(?:resgate|válido|valido)",
          ]

          for canal in canais:
              try:
                  resposta = sessao.get(
                      f"https://t.me/s/{canal}",
                      timeout=25,
                  )
                  resposta.raise_for_status()
                  soup = BeautifulSoup(resposta.text, "html.parser")
              except Exception as erro:
                  print(f"Erro ao consultar {canal}: {erro}")
                  continue

              mensagens = soup.select(".tgme_widget_message_wrap")

              for postagem in mensagens:
                  no_texto = postagem.select_one(
                      ".tgme_widget_message_text"
                  )
                  if not no_texto:
                      continue

                  texto = no_texto.get_text(" ", strip=True)

                  links = [
                      a.get("href", "")
                      for a in no_texto.select("a[href]")
                  ]

                  links_shopee = [
                      link for link in links
                      if re.search(r"shopee\.com", link, re.I)
                  ]

                  # Não publica mensagens sem link Shopee.
                  if not links_shopee:
                      continue

                  # Exige contexto explícito de cupom ou desconto.
                  tem_contexto_cupom = re.search(
                      r"\bcupom\b|\bc[oó]digo\b|"
                      r"R\$\s*\d+(?:[,.]\d+)?\s*OFF|"
                      r"\d+\s*%\s*OFF",
                      texto,
                      re.I,
                  )

                  if not tem_contexto_cupom:
                      continue

                  codigo = None

                  for padrao in padroes_codigo:
                      achados = re.finditer(
                          padrao, texto, re.I
                      )

                      for achado in achados:
                          candidato = achado.group(1).upper().strip()

                          # Evita palavras comuns confundidas com códigos.
                          if candidato in palavras_comuns:
                              continue

                          # Exige pelo menos um número e uma letra.
                          if not re.search(r"[A-Z]", candidato):
                              continue
                          if not re.search(r"\d", candidato):
                              continue

                          codigo = candidato
                          break

                      if codigo:
                          break

                  if not codigo:
                      print(
                          f"Ignorado: código não identificado "
                          f"em {canal}: {texto[:100]}"
                      )
                      continue

                  identidade = "codigo:" + codigo

                  if identidade in publicados:
                      print(f"Já publicado: {codigo}")
                      continue

                  # Identifica o valor do desconto, se estiver informado.
                  desconto = re.search(
                      r"R\$\s*\d+(?:[,.]\d+)?\s*OFF"
                      r"(?:\s+em\s+R\$\s*\d+(?:[,.]\d+)?)?",
                      texto,
                      re.I,
                  )

                  percentual = re.search(
                      r"\d+\s*%\s*OFF",
                      texto,
                      re.I,
                  )

                  valor = (
                      desconto.group(0) if desconto
                      else percentual.group(0) if percentual
                      else "Cupom Shopee"
                  )

                  # Tenta encontrar a validade, caso esteja na mensagem.
                  validade = re.search(
                      r"(?:validade|válido|válida|até)\s*[:\-]?\s*"
                      r".{0,50}",
                      texto,
                      re.I,
                  )

                  codigo_html = html.escape(codigo)
                  valor_html = html.escape(valor)
                  link_html = html.escape(
                      links_shopee[0], quote=True
                  )

                  mensagem = (
                      "🎟️ <b>CUPOM SHOPEE</b> 🎟️\n\n"
                      f"💸 <b>{valor_html}</b>\n\n"
                      f"🏷️ <b>Código:</b>\n"
                      f"<code>{codigo_html}</code>\n\n"
                  )

                  if validade:
                      mensagem += (
                          f"📅 {html.escape(validade.group(0))}\n\n"
                      )

                  mensagem += (
                      f'✅ <a href="{link_html}">'
                      f'RESGATAR CUPOM</a>'
                  )

                  try:
                      envio = sessao.post(
                          f"https://api.telegram.org/bot{token}/sendMessage",
                          data={
                              "chat_id": chat_id,
                              "text": mensagem,
                              "parse_mode": "HTML",
                              "disable_web_page_preview": "true",
                          },
                          timeout=25,
                      )
                      envio.raise_for_status()

                      if envio.json().get("ok"):
                          publicados.add(identidade)
                          novos.append(identidade)
                          print(f"Cupom publicado: {codigo}")
                      else:
                          print(
                              f"Telegram recusou {codigo}: "
                              f"{envio.text}"
                          )

                  except Exception as erro:
                      print(f"Erro ao publicar {codigo}: {erro}")

          arquivo.write_text(
              json.dumps(
                  sorted(publicados),
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )

          if novos:
              subprocess.run(
                  [
                      "git", "config", "user.name",
                      "github-actions[bot]"
                  ],
                  check=True,
              )
              subprocess.run(
                  [
                      "git", "config", "user.email",
                      "41898282+github-actions[bot]@users.noreply.github.com",
                  ],
                  check=True,
              )
              subprocess.run(
                  ["git", "add", "robo_cupons/cupons.json"],
                  check=True,
              )
              subprocess.run(
                  [
                      "git", "commit", "-m",
                      "Atualizar cupons publicados",
                  ],
                  check=True,
              )
              subprocess.run(["git", "push"], check=True)

          print(
              f"Execução concluída. Novos cupons: {len(novos)}"
          )
          PY
