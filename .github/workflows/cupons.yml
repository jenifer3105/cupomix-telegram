
name: Robo de Cupons Shopee

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  cupons:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Buscar e publicar cupons
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import re
          import json
          import html
          import hashlib
          import requests
          import subprocess
          from bs4 import BeautifulSoup
          from pathlib import Path

          token = os.environ["BOT_TOKEN"]
          chat_id = os.environ["CHAT_ID"]
          arquivo = Path("cupons.json")

          if arquivo.exists():
              try:
                  publicados = set(json.loads(arquivo.read_text(encoding="utf-8")))
              except (json.JSONDecodeError, OSError):
                  publicados = set()
          else:
              publicados = set()

          canais = [
              "cuponsvoltando",
              "fadadoscupons",
              "afiliadosshopeebroficial",
          ]

          sessao = requests.Session()
          sessao.headers.update({"User-Agent": "Mozilla/5.0"})
          novos = []

          for canal in canais:
              url = f"https://t.me/s/{canal}"

              try:
                  resposta = sessao.get(url, timeout=25)
                  resposta.raise_for_status()
                  soup = BeautifulSoup(resposta.text, "html.parser")
              except Exception as erro:
                  print(f"Erro ao consultar {canal}: {erro}")
                  continue

              mensagens = soup.select(".tgme_widget_message_wrap")

              for postagem in mensagens:
                  no_texto = postagem.select_one(".tgme_widget_message_text")
                  if not no_texto:
                      continue

                  texto = no_texto.get_text(" ", strip=True)
                  links = [
                      a.get("href", "")
                      for a in no_texto.select("a[href]")
                  ]

                  links_shopee = [
                      link for link in links
                      if "shopee.com" in link.lower()
                  ]

                  if not links_shopee:
                      continue

                  if not re.search(
                      r"shopee|cupom|c[oó]digo|off\b|desconto|"
                      r"frete gr[aá]tis|promo[cç][aã]o",
                      texto,
                      re.I,
                  ):
                      continue

                  codigo_match = re.search(
                      r"\b[A-Z0-9]{7,20}\b",
                      texto.upper(),
                  )
                  codigo = codigo_match.group(0) if codigo_match else ""

                  if codigo:
                      identidade = "codigo:" + codigo
                  else:
                      identidade = "post:" + hashlib.sha256(
                          (canal + texto).encode("utf-8")
                      ).hexdigest()

                  if identidade in publicados:
                      continue

                  categoria = "🎟️ CUPOM SHOPEE"
                  if re.search(r"frete gr[aá]tis", texto, re.I):
                      categoria = "🚚 FRETE GRÁTIS SHOPEE"

                  texto_seguro = html.escape(texto[:3000])
                  link_seguro = html.escape(links_shopee[0], quote=True)

                  mensagem = (
                      f"<b>{categoria}</b>\n\n"
                      f"{texto_seguro}\n\n"
                      f'<a href="{link_seguro}">🔗 Acessar oferta</a>'
                  )

                  try:
                      envio = sessao.post(
                          f"https://api.telegram.org/bot{token}/sendMessage",
                          data={
                              "chat_id": chat_id,
                              "text": mensagem,
                              "parse_mode": "HTML",
                          },
                          timeout=25,
                      )
                      envio.raise_for_status()

                      if envio.json().get("ok"):
                          publicados.add(identidade)
                          novos.append(identidade)
                          print(f"Cupom publicado: {identidade}")
                      else:
                          print(f"Telegram recusou a mensagem: {envio.text}")

                  except Exception as erro:
                      print(f"Erro ao publicar cupom: {erro}")

          arquivo.write_text(
              json.dumps(sorted(publicados), ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          if novos:
              subprocess.run(
                  ["git", "config", "user.name", "github-actions[bot]"],
                  check=True,
              )
              subprocess.run(
                  [
                      "git", "config", "user.email",
                      "41898282+github-actions[bot]@users.noreply.github.com",
                  ],
                  check=True,
              )
              subprocess.run(["git", "add", "cupons.json"], check=True)
              subprocess.run(
                  ["git", "commit", "-m", "Atualizar cupons publicados"],
                  check=True,
              )
              subprocess.run(["git", "push"], check=True)

          print(f"Execucao concluida. Novos cupons: {len(novos)}")
          PY
