
name: Robo de Cupons Shopee

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: robo-cupons-shopee
  cancel-in-progress: false

jobs:
  cupons:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Buscar e publicar cupons
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import re
          import json
          import html
          import subprocess
          import requests
          from pathlib import Path
          from bs4 import BeautifulSoup

          TOKEN = os.environ["BOT_TOKEN"]
          CHAT_ID = os.environ["CHAT_ID"]

          ARQUIVO = Path("robo_cupons/cupons.json")
          ARQUIVO.parent.mkdir(parents=True, exist_ok=True)

          try:
              publicados = set(json.loads(
                  ARQUIVO.read_text(encoding="utf-8")
              ))
          except (FileNotFoundError, json.JSONDecodeError, OSError):
              publicados = set()

          CANAIS = [
              "cuponsvoltando",
              "fadadoscupons",
              "afiliadosshopeebroficial",
          ]

          sessao = requests.Session()
          sessao.headers.update({
              "User-Agent": "Mozilla/5.0"
          })

          INVALIDOS = {
              "SHOPEE", "CUPOM", "CUPONS", "CODIGO", "CÓDIGO",
              "DISPONIVEL", "DISPONÍVEL", "DESCONTO", "RESGATE",
              "CARRINHO", "OFERTA", "COMPRAS", "VALIDO", "VÁLIDO",
              "PROMOCAO", "PROMOÇÃO", "GRATIS", "GRÁTIS",
              "AFILIADO", "AFILIADA", "PRODUTOS", "COMISSAO",
              "COMISSÃO", "ANUNCIO", "ANÚNCIO", "LINK", "AQUI",
              "DINHEIRO", "VOLTOU", "RESTAM", "USOS", "NINTENDO",
              "NORMAL", "VIP", "DISPON", "RESGATAR", "COD", "OFF",
              "PARA", "ACIMA", "VALIDADE", "EXCLUSIVO",
          }

          def extrair_codigo(texto):
              padroes = [
                  r"(?:código|codigo)\s*(?:do\s+cupom)?"
                  r"\s*[:=\-]?\s*([A-Z0-9_-]{5,30})",

                  r"\bcupom\s*[:=\-]\s*([A-Z0-9_-]{5,30})",

                  r"\b([A-Z0-9_-]{6,30})\s*:\s*R\$",

                  r"\b([A-Z0-9_-]{6,30})\b"
                  r"(?=\s*(?:[-–:|]\s*)?R\$\s*\d)",

                  r"R\$\s*\d+(?:[,.]\d+)?\s*OFF"
                  r".{0,100}?\b([A-Z][A-Z0-9_-]{5,29})\b",
              ]

              for padrao in padroes:
                  for achado in re.finditer(
                      padrao, texto, re.IGNORECASE
                  ):
                      codigo = achado.group(1).upper().strip(" _-")

                      if codigo in INVALIDOS:
                          continue
                      if not re.search(r"[A-Z]", codigo):
                          continue
                      if not re.search(r"\d", codigo):
                          continue
                      if not 6 <= len(codigo) <= 30:
                          continue

                      return codigo

              return None

          def extrair_desconto(texto):
              resultado = re.search(
                  r"R\$\s*\d+(?:[,.]\d+)?\s*OFF"
                  r"(?:\s*(?:em|acima de|a partir de)"
                  r"\s*R\$\s*\d+(?:[,.]\d+)?)?",
                  texto,
                  re.IGNORECASE,
              )

              if resultado:
                  return resultado.group(0).strip()

              resultado = re.search(
                  r"\d+\s*%\s*OFF",
                  texto,
                  re.IGNORECASE,
              )

              return resultado.group(0).strip() if resultado else None

          def extrair_minimo(texto):
              resultado = re.search(
                  r"(?:em compras acima de|em compras a partir de|"
                  r"acima de|a partir de|mínimo de|minimo de)"
                  r"\s*R\$\s*\d+(?:[,.]\d+)?",
                  texto,
                  re.IGNORECASE,
              )

              if not resultado:
                  return None

              valor = re.search(
                  r"R\$\s*\d+(?:[,.]\d+)?",
                  resultado.group(0),
                  re.IGNORECASE,
              )

              return valor.group(0) if valor else None

          def classificar_tipo(texto):
              if re.search(
                  r"\bVIP\b|exclusivo para membros|"
                  r"cupom exclusivo|somente para membros",
                  texto,
                  re.IGNORECASE,
              ):
                  return "💎 CUPOM VIP"

              return "🎟️ CUPOM NORMAL"

          def obter_links(texto, no_texto):
              links = [
                  a.get("href", "")
                  for a in no_texto.select("a[href]")
              ]

              # Também encontra URLs que estejam escritas
              # diretamente no texto da publicação.
              links += re.findall(
                  r"https?://[^\s<>\"']+",
                  texto,
                  re.IGNORECASE,
              )

              links_validos = []
              for link in links:
                  link = html.unescape(link).rstrip(".,;!?) ]}")

                  if re.search(
                      r"^https?://(?:[a-z0-9-]+\.)*"
                      r"shopee\.com(?:\.br)?(?:/|$|\?)",
                      link,
                      re.IGNORECASE,
                  ):
                      if link not in links_validos:
                          links_validos.append(link)

              return links_validos

          novos = []

          for canal in CANAIS:
              print(f"Consultando canal: {canal}")

              try:
                  resposta = sessao.get(
                      f"https://t.me/s/{canal}",
                      timeout=30,
                  )
                  resposta.raise_for_status()
                  soup = BeautifulSoup(
                      resposta.text, "html.parser"
                  )
              except Exception as erro:
                  print(f"Falha ao consultar {canal}: {erro}")
                  continue

              postagens = soup.select(
                  ".tgme_widget_message_wrap"
              )

              print(
                  f"Publicações visíveis em {canal}: "
                  f"{len(postagens)}"
              )

              for postagem in postagens:
                  no_texto = postagem.select_one(
                      ".tgme_widget_message_text"
                  )

                  if not no_texto:
                      continue

                  texto = no_texto.get_text(" ", strip=True)

                  # Exige contexto de cupom ou desconto.
                  if not re.search(
                      r"\bcupom\b|\bcódigo\b|\bcodigo\b|"
                      r"\b\d+\s*%\s*OFF\b|R\$\s*\d.*\bOFF\b",
                      texto,
                      re.IGNORECASE,
                  ):
                      continue

                  # Ignora anúncios claramente comerciais.
                  if re.search(
                      r"turbine suas comiss[oõ]es|"
                      r"comiss[oõ]es? em vendas|"
                      r"oportunidade de gerar cliques|"
                      r"produtos selecionados.*comiss[oã]o",
                      texto,
                      re.IGNORECASE,
                  ):
                      print("Ignorado: anúncio de comissão")
                      continue

                  codigo = extrair_codigo(texto)
                  desconto = extrair_desconto(texto)

                  if not codigo:
                      print(
                          f"Ignorado: código não reconhecido "
                          f"em {canal}: {texto[:140]}"
                      )
                      continue

                  if not desconto:
                      print(
                          f"Ignorado: desconto não identificado "
                          f"para {codigo}"
                      )
                      continue

                  links = obter_links(texto, no_texto)

                  if not links:
                      print(
                          f"Ignorado: link Shopee não encontrado "
                          f"para {codigo}"
                      )
                      continue

                  identidade = "codigo:" + codigo

                  if identidade in publicados:
                      print(f"Duplicado ignorado: {codigo}")
                      continue

                  tipo = classificar_tipo(texto)
                  minimo = extrair_minimo(texto)

                  mensagem = (
                      f"<b>{tipo}</b>\n\n"
                      f"💸 <b>Desconto:</b> "
                      f"{html.escape(desconto)}\n"
                  )

                  if minimo:
                      mensagem += (
                          f"🛒 <b>Compra mínima:</b> "
                          f"{html.escape(minimo)}\n"
                      )

                  mensagem += (
                      f"\n🏷️ <b>Código do cupom:</b>\n"
                      f"<code>{html.escape(codigo)}</code>\n\n"
                      "⚠️ Confira a validade e as condições "
                      "na Shopee.\n\n"
                      "🧡 <i>Cupomix • Seus achadinhos favoritos</i>"
                  )

                  try:
                      envio = sessao.post(
                          f"https://api.telegram.org/"
                          f"bot{TOKEN}/sendMessage",
                          json={
                              "chat_id": CHAT_ID,
                              "text": mensagem,
                              "parse_mode": "HTML",
                              "disable_web_page_preview": True,
                              "reply_markup": {
                                  "inline_keyboard": [[
                                      {
                                          "text": "✅ RESGATAR CUPOM",
                                          "url": links[0],
                                      }
                                  ]]
                              },
                          },
                          timeout=30,
                      )

                      envio.raise_for_status()
                      resultado = envio.json()

                      if resultado.get("ok"):
                          publicados.add(identidade)
                          novos.append(identidade)
                          print(
                              f"Publicado: {codigo} - {tipo}"
                          )
                      else:
                          print(
                              f"Erro Telegram para {codigo}: "
                              f"{resultado}"
                          )

                  except Exception as erro:
                      print(
                          f"Falha ao publicar {codigo}: {erro}"
                      )

          ARQUIVO.write_text(
              json.dumps(
                  sorted(publicados),
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )

          if novos:
              subprocess.run(
                  ["git", "config", "user.name",
                   "github-actions[bot]"],
                  check=True,
              )
              subprocess.run(
                  ["git", "config", "user.email",
                   "41898282+github-actions[bot]@users.noreply.github.com"],
                  check=True,
              )
              subprocess.run(
                  ["git", "add", "robo_cupons/cupons.json"],
                  check=True,
              )

              subprocess.run(
                  ["git", "commit", "-m",
                   "Atualizar histórico de cupons"],
                  check=True,
              )
              subprocess.run(["git", "push"], check=True)

          print(
              f"Execução concluída. Novos cupons: {len(novos)}"
          )
          PY
