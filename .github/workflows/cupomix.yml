name: Cupomix Telegram

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  enviar-teste:
    runs-on: ubuntu-latest

    steps:
      - name: Enviar mensagem para Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode "text=✅ Cupomix funcionando pelo GitHub Actions!"
