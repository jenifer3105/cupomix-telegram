
name: Cupomix Telegram

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  enviar-ofertas:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar histórico
        uses: actions/checkout@v4

      - name: Buscar oferta e enviar Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
        run: |
          python3 -m pip install requests

          cat > /tmp/enviar.py <<'PY'
          import os, json, time, hashlib, requests
          from pathlib import Path

          app_id = os.environ["SHOPEE_APP_ID"]
          secret = os.environ["SHOPEE_SECRET"]
          bot = os.environ["BOT_TOKEN"]
          chat = os.environ["CHAT_ID"]

          historico_path = Path("historico.json")
          try:
              historico = json.loads(historico_path.read_text())
          except Exception:
              historico = []

          timestamp = int(time.time())
          query = """
          query {
            productOfferV2(page: 1, limit: 50) {
              nodes {
                productName
                price
                imageUrl
                productLink
              }
            }
          }
          """
          payload = json.dumps({"query": query}, separators=(",", ":"))
          assinatura = hashlib.sha256(
              (app_id + str(timestamp) + payload + secret).encode()
          ).hexdigest()

          headers = {
              "Content-Type": "application/json",
              "Authorization": (
                  f"SHA256 Credential={app_id}, Timestamp={timestamp}, "
                  f"Signature={assinatura}"
              )
          }

          resposta = requests.post(
              "https://open-api.affiliate.shopee.com.br/graphql",
              headers=headers, data=payload, timeout=30
          )
          resposta.raise_for_status()
          dados = resposta.json()

          if "errors" in dados:
              raise RuntimeError(json.dumps(dados["errors"], ensure_ascii=False))

          produtos = dados.get("data", {}).get(
              "productOfferV2", {}
          ).get("nodes", [])

          if not produtos:
              raise RuntimeError("A Shopee não retornou produtos.")

          produto = next(
              (p for p in produtos
               if p.get("productLink")
               and p.get("productName")
               and p.get("productLink") not in historico),
              None
          )

          if not produto:
              raise RuntimeError(
                  "Não há produto novo nesta página. "
                  "A consulta pode estar retornando sempre os mesmos itens."
              )

          nome = produto["productName"]
          preco = produto.get("price", "")
          link = produto["productLink"]
          imagem = produto.get("imageUrl", "")

          legenda = (
              f"🔥 OFERTA NA SHOPEE 🔥\n\n"
              f"🛍️ {nome}\n\n"
              f"💰 Preço informado: R$ {preco}\n\n"
              f"⚡ Confira o preço e os cupons disponíveis na Shopee!\n\n"
              f"🟠 Cupomix"
          )

          base = f"https://api.telegram.org/bot{bot}/"
          if imagem:
              envio = requests.post(
                  base + "sendPhoto",
                  data={
                      "chat_id": chat,
                      "photo": imagem,
                      "caption": legenda,
                      "reply_markup": json.dumps({
                          "inline_keyboard": [[
                              {"text": "🛒 COMPRAR AGORA", "url": link}
                          ]]
                      })
                  },
                  timeout=30
              )
          else:
              envio = requests.post(
                  base + "sendMessage",
                  data={
                      "chat_id": chat,
                      "text": legenda + f"\n\n🛒 Comprar: {link}",
                      "reply_markup": json.dumps({
                          "inline_keyboard": [[
                              {"text": "🛒 COMPRAR AGORA", "url": link}
                          ]]
                      })
                  },
                  timeout=30
              )

          envio.raise_for_status()
          resultado = envio.json()
          if not resultado.get("ok"):
              raise RuntimeError(json.dumps(resultado, ensure_ascii=False))

          historico.append(link)
          historico_path.write_text(
              json.dumps(historico[-500:], ensure_ascii=False, indent=2)
          )
          PY

          python3 /tmp/enviar.py

      - name: Salvar histórico de produtos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historico.json
          git diff --cached --quiet || git commit -m "Atualizar histórico de ofertas"
          git push
