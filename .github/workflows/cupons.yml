
name: Robo de Cupons Shopee

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  cupons:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Buscar e publicar cupons
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import re
          import json
          import html
          import hashlib
          import requests
          import subprocess
          from bs4 import BeautifulSoup
          from pathlib import Path

          token = os.environ["BOT_TOKEN"]
          chat_id = os.environ["CHAT_ID"]
          arquivo = Path("robo_cupons/cupons.json")
          arquivo.parent.mkdir(parents=True, exist_ok=True)

          try:
              publicados = set(json.loads(arquivo.read_text(encoding="utf-8")))
          except (FileNotFoundError, json.JSONDecodeError, OSError):
              publicados = set()

          canais = [
              "cuponsvoltando",
              "fadadoscupons",
              "afiliadosshopeebroficial",
          ]

          sessao = requests.Session()
          sessao.headers.update({"User-Agent": "Mozilla/5.0"})
          novos = []

          # Exige contexto explícito de cupom e um código associado.
          padroes_codigo = [
              r"(?:c[oó]digo|cupom)\s*[:\-]?\s*([A-Z0-9]{5,25})",
              r"\b([A-Z0-9]{7,20})\s*:\s*R\$\s*\d",
          ]

          for canal in canais:
              try:
                  resposta = sessao.get(
                      f"https://t.me/s/{canal}", timeout=25
                  )
                  resposta.raise_for_status()
                  soup = BeautifulSoup(resposta.text, "html.parser")
              except Exception as erro:
                  print(f"Erro ao consultar {canal}: {erro}")
                  continue

              for postagem in soup.select(".tgme_widget_message_wrap"):
                  no_texto = postagem.select_one(
                      ".tgme_widget_message_text"
                  )
                  if not no_texto:
                      continue

                  texto = no_texto.get_text(" ", strip=True)
                  links = [
                      a.get("href", "")
                      for a in no_texto.select("a[href]")
                  ]
                  links_shopee = [
                      link for link in links
                      if re.search(r"shopee\.com", link, re.I)
                  ]

                  # Só aceita publicações com contexto claro de cupom.
                  if not re.search(
                      r"\bcupom\b|\bc[oó]digo\b|\bR\$\s*\d.*\bOFF\b|"
                      r"\b\d+\s*%\s*OFF\b",
                      texto,
                      re.I,
                  ):
                      continue

                  codigo = None
                  for padrao in padroes_codigo:
                      achado = re.search(padrao, texto, re.I)
                      if achado:
                          candidato = achado.group(1).upper()
                          if candidato not in {
                              "SHOPEE", "CUPOM", "CODIGO", "CÓDIGO"
                          }:
                              codigo = candidato
                              break

                  # Sem código explícito, não publica.
                  if not codigo:
                      print(f"Ignorado: sem código explícito ({canal})")
                      continue

                  identidade = "codigo:" + codigo
                  if identidade in publicados:
                      continue

                  # Só publica quando houver link Shopee.
                  if not links_shopee:
                      print(f"Ignorado: sem link Shopee ({codigo})")
                      continue

                  desconto = re.search(
                      r"R\$\s*\d+(?:[,.]\d+)?\s*OFF"
                      r"(?:\s+em\s+R\$\s*\d+(?:[,.]\d+)?)?",
                      texto,
                      re.I,
                  )
                  valor = desconto.group(0) if desconto else "Cupom Shopee"

                  codigo_html = html.escape(codigo)
                  link_html = html.escape(links_shopee[0], quote=True)

                  mensagem = (
                      "🎟️ <b>CUPOM SHOPEE</b> 🎟️\n\n"
                      f"💸 <b>{html.escape(valor)}</b>\n\n"
                      f"🏷️ <b>Código:</b> <code>{codigo_html}</code>\n\n"
                      f'✅ <a href="{link_html}">RESGATAR CUPOM</a>'
                  )

                  try:
                      envio = sessao.post(
                          f"https://api.telegram.org/bot{token}/sendMessage",
                          data={
                              "chat_id": chat_id,
                              "text": mensagem,
                              "parse_mode": "HTML",
                              "disable_web_page_preview": "true",
                          },
                          timeout=25,
                      )
                      envio.raise_for_status()

                      if envio.json().get("ok"):
                          publicados.add(identidade)
                          novos.append(identidade)
                          print(f"Publicado: {codigo}")
                      else:
                          print(f"Erro do Telegram: {envio.text}")

                  except Exception as erro:
                      print(f"Erro ao publicar {codigo}: {erro}")

          arquivo.write_text(
              json.dumps(sorted(publicados), ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          if novos:
              subprocess.run(
                  ["git", "config", "user.name", "github-actions[bot]"],
                  check=True,
              )
              subprocess.run(
                  [
                      "git", "config", "user.email",
                      "41898282+github-actions[bot]@users.noreply.github.com",
                  ],
                  check=True,
              )
              subprocess.run(
                  ["git", "add", "robo_cupons/cupons.json"], check=True
              )
              subprocess.run(
                  ["git", "commit", "-m", "Atualizar cupons publicados"],
                  check=True,
              )
              subprocess.run(["git", "push"], check=True)

          print(f"Concluído. Novos cupons: {len(novos)}")
          PY
