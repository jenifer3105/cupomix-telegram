name: Cupomix Telegram

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  enviar-ofertas:
    runs-on: ubuntu-latest

    steps:
      - name: Buscar ofertas Shopee e enviar Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}

        run: |
          python3 <<'PY'
          import os
          import time
          import json
          import hashlib
          import requests

          APP_ID = os.environ["SHOPEE_APP_ID"]
          SECRET = os.environ["SHOPEE_SECRET"]
          BOT_TOKEN = os.environ["BOT_TOKEN"]
          CHAT_ID = os.environ["CHAT_ID"]

          SHOPEE_URL = "https://open-api.affiliate.shopee.com.br/graphql"

          def shopee_request(payload):
              timestamp = int(time.time())

              factor = APP_ID + str(timestamp) + payload + SECRET

              signature = hashlib.sha256(
                  factor.encode()
              ).hexdigest()

              authorization = (
                  f"SHA256 Credential={APP_ID}, "
                  f"Timestamp={timestamp}, "
                  f"Signature={signature}"
              )

              headers = {
                  "Content-Type": "application/json",
                  "Authorization": authorization
              }

              resposta = requests.post(
                  SHOPEE_URL,
                  headers=headers,
                  data=payload,
                  timeout=30
              )

              print("Shopee:", resposta.status_code)

              if resposta.status_code != 200:
                  raise Exception(
                      f"Erro HTTP Shopee: {resposta.status_code}"
                  )

              dados = resposta.json()

              if "errors" in dados:
                  raise Exception(
                      "Erro Shopee: "
                      + json.dumps(dados["errors"])
                  )

              return dados

          # ----------------------------------------
          # 1. BUSCAR OFERTAS
          # ----------------------------------------

          query = """
          query {
            productOfferV2(
              page: 1,
              limit: 10
            ) {
              nodes {
                productName
                price
                imageUrl
                productLink
              }
            }
          }
          """

          payload = json.dumps(
              {"query": query},
              separators=(",", ":")
          )

          dados = shopee_request(payload)

          produtos = (
              dados
              .get("data", {})
              .get("productOfferV2", {})
              .get("nodes", [])
          )

          print("Produtos encontrados:", len(produtos))

          if not produtos:
              print("Nenhuma oferta encontrada.")
              exit()

          # ----------------------------------------
          # 2. ENVIAR CADA OFERTA
          # ----------------------------------------

          telegram_url = (
              f"https://api.telegram.org/bot"
              f"{BOT_TOKEN}/sendMessage"
          )

          for produto in produtos:

              nome = produto.get(
                  "productName",
                  "Produto"
              )

              preco = produto.get(
                  "price",
                  ""
              )

              imagem = produto.get(
                  "imageUrl",
                  ""
              )

              link_original = produto.get(
                  "productLink",
                  ""
              )

              if not link_original:
                  print("Produto sem link. Pulando.")
                  continue

              # ----------------------------------------
              # 3. GERAR LINK DE AFILIADO
              # ----------------------------------------

              mutation = """
              mutation {
                generateShortLink(
                  input: {
                    originUrl: "%s"
                    subIds: ["telegram", "cupomix"]
                  }
                ) {
                  shortLink
                }
              }
              """ % link_original.replace('"', '\\"')

              affiliate_payload = json.dumps(
                  {"query": mutation},
                  separators=(",", ":")
              )

              try:
                  affiliate_data = shopee_request(
                      affiliate_payload
                  )

                  link_afiliado = (
                      affiliate_data
                      .get("data", {})
                      .get("generateShortLink", {})
                      .get("shortLink", "")
                  )

              except Exception as erro:
                  print(
                      "Erro ao gerar link afiliado:",
                      erro
                  )
                  link_afiliado = ""

              # Se não conseguiu gerar o afiliado,
              # não manda o link normal por engano.
              if not link_afiliado:
                  print(
                      "Não foi possível gerar link afiliado."
                  )
                  continue

              # ----------------------------------------
              # 4. MENSAGEM TELEGRAM
              # ----------------------------------------

              mensagem = f"""🔥 OFERTA NA SHOPEE 🔥

          🛍️ {nome}

          💰 Preço: R$ {preco}

          👉 COMPRAR AGORA:
          {link_afiliado}

          ⚡ Aproveite antes que o preço mude!

          🟠 Cupomix"""

              # ----------------------------------------
              # 5. ENVIAR PARA TELEGRAM
              # ----------------------------------------

              envio = requests.post(
                  telegram_url,
                  data={
                      "chat_id": CHAT_ID,
                      "text": mensagem
                  },
                  timeout=30
              )

              print(
                  "Telegram:",
                  envio.status_code
              )

              if envio.status_code != 200:
                  print(envio.text)

              # Pequena pausa entre mensagens
              time.sleep(1)

          print("Ofertas enviadas com sucesso!")

          PY
